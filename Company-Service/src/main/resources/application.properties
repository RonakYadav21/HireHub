spring.application.name=COMPANY-SERVICE
server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5432/Placement-company
spring.datasource.username=postgres
spring.datasource.password=post#4343
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.boot.admin.client.url=http://localhost:9091
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance Health Management
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Management and Actuator Settings
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
