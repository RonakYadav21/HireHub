# =========================
# Spring App Config
# =========================
spring.application.name=PLACEMENT-SERVICE
server.port=8086

# =========================
# Database Config
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/Placement-Service
spring.datasource.username=postgres
spring.datasource.password=post#4343
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================
# Eureka & Spring Boot Admin
# =========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.boot.admin.client.url=http://localhost:9091

# =========================
# RabbitMQ Config
# =========================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Manual ack mode (must handle in listener)
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# =========================
# Feign Client Config
# =========================
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

# =========================
# Resilience4j - Retry Config
# =========================
# Company Service Retry
resilience4j.retry.instances.companyRetry.max-attempts=3
resilience4j.retry.instances.companyRetry.wait-duration=2000ms
resilience4j.retry.instances.companyRetry.enable-exponential-backoff=true
resilience4j.retry.instances.companyRetry.exponential-backoff-multiplier=2

# Student Service Retry
resilience4j.retry.instances.studentRetry.max-attempts=3
resilience4j.retry.instances.studentRetry.wait-duration=2s

# Auth Service Retry
resilience4j.retry.instances.authRetry.max-attempts=3
resilience4j.retry.instances.authRetry.wait-duration=2s

# =========================
# Resilience4j - Circuit Breaker Config
# =========================
# Company Service Circuit Breaker
resilience4j.circuitbreaker.instances.companyCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.companyCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.companyCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.companyCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.companyCircuitBreaker.permitted-number-of-calls-in-half-open-state=3

# Student Service Circuit Breaker
resilience4j.circuitbreaker.instances.studentCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.studentCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.studentCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.studentCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.studentCircuitBreaker.permitted-number-of-calls-in-half-open-state=3

# Auth Service Circuit Breaker
resilience4j.circuitbreaker.instances.authCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.authCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.authCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.authCircuitBreaker.permitted-number-of-calls-in-half-open-state=3

# =========================
# Logging (for debugging)
# =========================
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
